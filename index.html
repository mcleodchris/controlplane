<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Controlplane - Web Application GUI for Mage API">
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#3b82f6" media="(prefers-color-scheme: dark)">

  <!-- Prevent auto-zoom on iOS -->
  <meta name="format-detection" content="telephone=no">

  <title>Controlplane</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Runtime environment variables (replaced at container startup) -->
  <script>
    window.ENV = {
      API_BASE_URL: '${API_BASE_URL}',
      APP_NAME: '${APP_NAME}'
    };
  </script>
</head>
<body>
  <div id="app">
    <!-- App content rendered here by JavaScript -->
    <noscript>
      <div style="padding: 2rem; text-align: center;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript to use Controlplane.</p>
      </div>
    </noscript>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
